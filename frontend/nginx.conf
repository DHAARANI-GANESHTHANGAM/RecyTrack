# Serves the built dashboard and proxies the API, so the browser only talks to one
# origin and the backend needs no CORS configuration.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API accepts CSV uploads up to 10 MB; leave room for multipart overhead.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Interactive API docs (Swagger UI) and the schema it loads.
    location = /docs {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /exceptions/<id>) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
