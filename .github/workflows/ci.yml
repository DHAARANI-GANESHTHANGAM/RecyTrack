name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recytrack
          POSTGRES_PASSWORD: recytrack
          POSTGRES_DB: recytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recytrack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: API tests (PostgreSQL)
        run: pytest -q tests/test_api.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://recytrack:recytrack@localhost:5432/recytrack_test
