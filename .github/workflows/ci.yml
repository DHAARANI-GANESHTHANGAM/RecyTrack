name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recytrack
          POSTGRES_PASSWORD: recytrack
          POSTGRES_DB: recytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recytrack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Measured results (fails if quality, idempotency or reconciliation regresses)
        run: python -m scripts.measure
      - name: API tests (PostgreSQL)
        run: pytest -q tests/test_api.py tests/test_reconciliation_api.py tests/test_api_ingestion.py tests/test_freshness.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://recytrack:recytrack@localhost:5432/recytrack_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Build images
        run: docker compose build
